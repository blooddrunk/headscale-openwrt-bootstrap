# BEGIN headscale-bootstrap managed
# Managed by headscale-openwrt-bootstrap.  Edits inside the markers are
# replaced by `headscale-vps.sh apply`.  Place custom directives outside.
http://__DOMAIN__ {
	handle /generate_204 {
		respond 204
	}

	handle * {
		redir https://{host}{uri}
	}
}

__DOMAIN__ {
	reverse_proxy __UPSTREAM__ {
		header_up True-Client-IP {remote_host}
		header_up X-Real-IP {remote_host}
	}
}
# END headscale-bootstrap managed
