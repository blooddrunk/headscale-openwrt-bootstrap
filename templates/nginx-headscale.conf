# BEGIN headscale-bootstrap managed
# Managed by headscale-openwrt-bootstrap.  TLS certificate provisioning is a
# separate concern (PLAN 10.2): fill ssl_certificate/ssl_certificate_key for
# your deployment or provide them via a shared include before reloading.
# `nginx -t` failing restores the previous file; nothing is reloaded broken.
map $http_upgrade $connection_upgrade {
	default keep-alive;
	''      close;
}

server {
	listen 80;
	server_name __DOMAIN__;

	location /generate_204 {
		return 204;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	server_name __DOMAIN__;

	# ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

	location / {
		proxy_pass http://__UPSTREAM__;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header True-Client-IP $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
	}
}
# END headscale-bootstrap managed
