# Synthetic 1Panel-generated vhost fixture for the reverse-proxy site.

server {
    listen 80;
    listen 443 ssl;
    server_name hs.example.com;
    index index.html;
    access_log /www/sites/hs.example.com/log/access.log main;
    error_log /www/sites/hs.example.com/log/error.log;
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    location ^~ /.well-known/acme-challenge {
        allow all;
    }
    # ACME certificate placeholder: the real deployment provides one.
    ssl_certificate /www/sites/hs.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/hs.example.com/ssl/privkey.pem;
    include /www/sites/hs.example.com/proxy/*.conf;
}
