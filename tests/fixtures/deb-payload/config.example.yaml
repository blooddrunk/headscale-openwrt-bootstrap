# Fixture payload: the default config a freshly installed headscale .deb
# would place on disk.  It carries the managed keys plus unrelated keys the
# renderer must preserve verbatim, and a commented listen_addr that comment
# aware parsing must ignore.
server_url: http://127.0.0.1:8080

# listen_addr: 0.0.0.0:8080
listen_addr: 127.0.0.1:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

derp:
  server:
    enabled: false
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 198.51.100.1
    ipv6: 2001:db8::1
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true

# Mirrors the headscale 0.29.x packaged example: MagicDNS on with the
# placeholder base_domain and Cloudflare global resolvers that would be
# pushed to every accept-dns=true client until enable-magic-dns /
# disable-magic-dns records its intent.
dns:
  magic_dns: true
  base_domain: example.com
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    split: {}
  search_domains: []

disable_check_updates: false
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

tls_cert_path: ""
tls_key_path: ""

trusted_proxies: []
